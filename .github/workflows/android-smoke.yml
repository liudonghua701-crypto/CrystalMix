name: Android APK smoke test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the APK
        default: android-v1.0.0
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download signed release APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p smoke-artifacts
          gh release download "$RELEASE_TAG" --pattern 'CrystalMix-Android-1.0.0.apk' --dir smoke-artifacts
      - name: Prepare Android emulator
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/crystalmix-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-34;default;x86_64'
          echo no | avdmanager create avd -n crystalmix -k 'system-images;android-34;default;x86_64' --device pixel
          "$ANDROID_HOME/emulator/emulator" -avd crystalmix -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on > smoke-artifacts/emulator.log 2>&1 &
          timeout 120 adb wait-for-device || { cat smoke-artifacts/emulator.log; exit 1; }
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell wm size 480x1000
          adb shell wm density 160
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r smoke-artifacts/CrystalMix-Android-1.0.0.apk
      - name: Exercise native application
        run: python3 tools/android-smoke.py
      - name: Collect runtime diagnostics
        if: always()
        run: |
          timeout 15 adb logcat -d > smoke-artifacts/logcat.txt || true
          rm -f smoke-artifacts/CrystalMix-Android-1.0.0.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: smoke-artifacts/
